name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/affectionate-franklin-od0jho
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy supersedes one in flight rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns the Pages site on via the API, so the repo does
      # not need the setting flipped by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
